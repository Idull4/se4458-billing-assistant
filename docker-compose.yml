# Local stack: PostgreSQL + Billing API + MCP server + Kong API Gateway.
#   docker compose up --build
# Gateway: http://localhost:8000   MCP: http://localhost:3001/mcp   Swagger: http://localhost:8000/api/v1/docs
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      retries: 20

  billing-api:
    build: { context: ., dockerfile: billing-api/Dockerfile }
    environment:
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      SEED_ON_START: "true"
    depends_on:
      postgres: { condition: service_healthy }
    # Not published: clients must use the gateway.
    expose: ["3000"]

  mcp-server:
    build: { context: ., dockerfile: mcp-server/Dockerfile }
    ports: ["3001:3001"]

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./gateway/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000", "8001:8001"]
    depends_on: [billing-api]

volumes:
  pgdata:
