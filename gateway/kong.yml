# Kong API Gateway - declarative (DB-less) configuration.
# Every Billing REST operation (including all AI agent calls) is routed through this gateway.
# Public base URL (local): http://localhost:8000
_format_version: "3.0"

services:
  - name: billing-api-v1
    url: http://billing-api:3000
    connect_timeout: 5000
    read_timeout: 15000
    routes:
      # POST /api/v1/auth/login -> billing-api /api/v1/auth/login (public, brute-force limited)
      - name: auth-login
        paths: ["/api/v1/auth/login"]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 20, policy: local, limit_by: ip }

      # GET /api/v1/bills -> Query Bill (public per specification; rate-limited)
      - name: query-bill-public
        paths: ["~/api/v1/bills$"]
        methods: [GET]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 30, policy: local, limit_by: ip }

      # Protected routes: JWT validated at the gateway (and again by the API).
      #   GET  /api/v1/bills/detailed   Query Bill Detailed (subscriber/admin, paged)
      #   POST /api/v1/bills/pay        Pay Bill (subscriber/admin)
      #   POST /api/v1/bills/calculate  Calculate Bill (admin)
      #   POST /api/v1/usage            Add Usage (admin)
      - name: billing-protected
        paths: ["/api/v1/bills/detailed", "/api/v1/bills/pay", "/api/v1/bills/calculate", "/api/v1/usage"]
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              header_names: [authorization]
          - name: rate-limiting
            config: { minute: 60, policy: local, limit_by: header, header_name: Authorization }

      # Swagger UI and OpenAPI document
      - name: api-docs
        paths: ["/api/v1/docs", "/api/v1/openapi.json"]
        methods: [GET]
        strip_path: false

consumers:
  - username: billing-clients
    jwt_secrets:
      # `key` must equal the token's `iss` claim; `secret` must equal JWT_SECRET of billing-api.
      # Development secret only - production uses a different secret (Azure APIM named value).
      - key: billing-api
        algorithm: HS256
        secret: dev-only-jwt-secret-change-me

plugins:
  # Adds X-Request-ID to every request/response for tracing.
  - name: correlation-id
    config: { header_name: X-Request-ID, generator: uuid, echo_downstream: true }
